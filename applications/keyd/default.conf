j = macro(esc esc esc)

[control]
#m = M-m
# Mozc composition intercepts raw Ctrl+Space before GNOME's global
# shortcut can fire; remap to Scroll Lock here (evdev layer, before
# ibus) so GNOME's fep-toggle custom keybinding (bound to Scroll_Lock)
# always fires. F13-F24 have no keysym in the active "us" XKB layout
# (verified via /usr/share/X11/xkb/symbols/pc: no F13+ entries), so
# GNOME could never resolve them; Scroll_Lock has a keysym in the
# base pc105 symbols and is otherwise unused here.
space = scrolllock

