[ids]
*

[main]
capslock = leftcontrol
leftcontrol = leftmeta
# capslock = layer(control)
# leftcontrol = layer(meta)
pageup = left
pagedown = right

f1 = M-up
f2 = M-left
f3 = M-right

[after_k]
j = macro(esc esc esc)

[control]
#m = M-m
# Mozc composition intercepts raw Ctrl+Space before GNOME's global
# shortcut can fire; remap to Scroll Lock here (evdev layer, before
# ibus) so GNOME's fep-toggle custom keybinding (bound to Scroll_Lock)
# always fires. F13-F24 have no keysym in the active "us" XKB layout
# (verified via /usr/share/X11/xkb/symbols/pc: no F13+ entries), so
# GNOME could never resolve them; Scroll_Lock has a keysym in the
# base pc105 symbols and is otherwise unused here.
space = scrolllock

# Ctrl+Shift+Space must reach GNOME unmodified (bound to the "Nuts Launcher"
# custom keybinding, <Control><Shift>space). An empty [control+shift] layer
# is NOT enough: per `man keyd` (COMPOSITE LAYERS), a composite layer only
# takes precedence for keys it explicitly binds; an unbound key falls
# through the layer stack to [control]'s space=scrolllock binding, which is
# still active whenever Control is held. So space must be bound explicitly
# here. Composite-layer explicit bindings also strip the composed modifiers
# from the emitted key (see the control+alt+h -> bare "left" example in
# `man keyd`), so C-S-space re-asserts Control+Shift on the emitted space to
# reproduce a literal, unmangled Ctrl+Shift+Space (#56).
[control+shift]
space = C-S-space

